name: Metrics
on:
  # Met à jour les stats tous les jours à minuit
  schedule: [{ cron: "0 0 * * *" }]
  # Permet de lancer la mise à jour manuellement si besoin
  workflow_dispatch:
  # Met à jour quand tu modifies le README
  push: { branches: ["master", "main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Générer les métriques générales
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          output_action: commit
          commits_authoring: abwii, Wassim B.

      - name: Générer les métriques de langages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          config_timezone: Europe/Paris
          output_action: commit
